name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ─── Shared package ───
      - name: Shared typecheck
        run: pnpm shared:typecheck

      - name: Shared build
        run: pnpm shared:build

      # ─── Database ───
      - name: Database typecheck
        run: pnpm --filter @blockforge/database typecheck

      # ─── API ───
      - name: API tests
        run: pnpm --filter @blockforge/api test

      - name: API typecheck
        run: pnpm api:typecheck

      - name: API build
        run: pnpm api:build

      # ─── Worker ───
      - name: Worker tests
        run: pnpm worker:test

      - name: Worker typecheck
        run: pnpm worker:typecheck

      - name: Worker build
        run: pnpm worker:build

      # ─── Contracts ───
      - name: Contract TypeScript tests
        run: pnpm --filter @blockforge/contracts test:node

      # ─── Frontend ───
      - name: Frontend typecheck
        run: pnpm web:typecheck

      - name: Frontend build
        run: pnpm web:build

  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: APP_FILTER=@blockforge/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: APP_FILTER=@blockforge/worker
          cache-from: type=gha
          cache-to: type=gha,mode=max
