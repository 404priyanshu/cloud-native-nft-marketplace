services:
  api:
    build:
      args:
        APP_FILTER: "@blockforge/api"
      context: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      AUTH_NONCE_TTL_SECONDS: 300
      CORS_ORIGIN: "*"
      DATABASE_URL: "postgresql://blockforge:blockforge@postgres:5432/blockforge?schema=public"
      JWT_EXPIRES_IN_SECONDS: 3600
      JWT_SECRET: "blockforge-local-docker-secret"
      PORT: 3001
      REDIS_URL: "redis://redis:6379"
      S3_BUCKET: ""
      UPLOAD_URL_TTL_SECONDS: 300
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    ports:
      - "3001:3001"
    restart: unless-stopped

  worker:
    build:
      args:
        APP_FILTER: "@blockforge/worker"
      context: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      CHAIN_ID: 31337
      DATABASE_URL: "postgresql://blockforge:blockforge@postgres:5432/blockforge?schema=public"
      INDEXER_BLOCK_RANGE: 1000
      INDEXER_LOCK_TTL_MS: 30000
      INDEXER_POLL_INTERVAL_MS: 5000
      INDEXER_START_BLOCK: 0
      MARKETPLACE_CONTRACT_ADDRESS: "0x0000000000000000000000000000000000000000"
      NETWORK_NAME: "local"
      NFT_CONTRACT_ADDRESS: "0x0000000000000000000000000000000000000000"
      REDIS_URL: "redis://redis:6379"
      RPC_URL: "http://host.docker.internal:8545"
    profiles:
      - worker
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: blockforge
      POSTGRES_PASSWORD: blockforge
      POSTGRES_USER: blockforge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blockforge -d blockforge"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
